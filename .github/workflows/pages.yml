name: Deploy Hosted Pages Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: source/frontend
        run: npm ci

      - name: Run hosted unit checks
        working-directory: source/frontend
        run: npm run test:unit

      - name: Build Pages project-path bundle
        working-directory: source/frontend
        env:
          VITE_PUBLIC_BASE: "/${{ github.event.repository.name }}/"
        run: npm run build:pages

      - name: Run Pages-subpath production smoke
        working-directory: source/frontend
        env:
          VITE_PUBLIC_BASE: "/${{ github.event.repository.name }}/"
        run: npm run test:hosted:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: source/frontend/dist-pages

  deploy:
    name: Deploy Pages artifact
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
