name: Deploy Hosted Pages Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    name: Build Pages artifact
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: source/frontend
        run: npm ci

      - name: Install Chromium for hosted smoke tests
        working-directory: source/frontend
        run: npx playwright install --with-deps chromium

      - name: Run hosted unit checks
        working-directory: source/frontend
        run: npm run test:unit

      - name: Build Pages project-path bundle
        working-directory: source/frontend
        env:
          VITE_PUBLIC_BASE: "/${{ github.event.repository.name }}/"
          VITE_HOSTED_MODEL_ENABLED: "false"
        run: npm run build:pages

      - name: Run Pages-subpath production smoke
        working-directory: source/frontend
        env:
          VITE_PUBLIC_BASE: "/${{ github.event.repository.name }}/"
          VITE_HOSTED_MODEL_ENABLED: "false"
        run: npm run test:hosted:pages

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: source/frontend/dist-pages

  deploy:
    name: Deploy Pages artifact
    runs-on: ubuntu-latest
    needs: build
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

  static-smoke:
    name: Verify deployed Pages origin
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 20
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v7

      - name: Set up Node
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: source/frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: source/frontend
        run: npm ci

      - name: Install Chromium for deployed smoke tests
        working-directory: source/frontend
        run: npx playwright install --with-deps chromium

      - name: Verify deployed static origin
        working-directory: source/frontend
        env:
          HOSTED_PAGES_URL: ${{ needs.deploy.outputs.page_url }}
        run: npm run test:hosted:pages:live:static

      - name: Upload deployed smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: hosted-pages-static-smoke
          path: |
            source/frontend/test-results
            source/frontend/playwright-report
          if-no-files-found: ignore
